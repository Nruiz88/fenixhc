<!DOCTYPE html>
<!--
  PLANTILLA RESEND — Verificación de email
  ---------------------------------------------------------------
  Variables que espera Resend:
    {{nombre}}  nombre de la persona (se escapa solo)
    {{link}}    URL completa de verificación, YA con el token

  Para usar: en resend.com -> Templates -> Create -> pegá este HTML.
  Después poné el ID en la variable de entorno RESEND_TEMPLATE_VERIFICACION.

  POR QUÉ FONDO CLARO Y NO OSCURO
  La versión anterior usaba background:#0A0A0A con texto blanco. Outlook
  renderiza los fondos oscuros mal salvo que se metan etiquetas VML, y hay
  clientes móviles que los descartan. Un fondo claro no necesita nada de eso.

  CUIDADO — {{link}} ES LO MÁS DELICADO DEL CORREO
  Si se rompe este botón, nadie puede activar su cuenta. Hay una red de
  seguridad: si no hay RESEND_TEMPLATE_VERIFICACION definida, la app manda
  el HTML embebido de src/lib/email.ts. Probá SIEMPRE con un envío real antes
  de confiar en la plantilla.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificá tu email</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <!-- Contenedor: 600px es el ancho que se ve bien en escritorio y en mobile -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5; padding:24px 12px;">
    <tr>
      <td align="center">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:12px; border:1px solid #e4e4e7; overflow:hidden;">

          <!-- Franja superior: da identidad sin depender de que el bloqueo de -->
          <!-- imágenes esté activo. Los logos en bloque casi nunca se ven.<tr>
            <td style="background:#dc2626; padding:14px 28px;">
              <span style="color:#ffffff; font-size:15px; font-weight:700; letter-spacing:1px;">FENIX ROLLER HOCKEY</span>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 28px 8px 28px;">
              <h1 style="margin:0 0 12px 0; font-size:20px; line-height:1.3; color:#18181b; font-weight:700;">Verificá tu email</h1>
              <p style="margin:0; font-size:15px; line-height:1.6; color:#52525b;">
                Hola {{nombre}}, falta confirmar tu email para poder entrar al portal.
                Hacé clic en el botón y tu cuenta queda activa.
              </p>
            </td>
          </tr>

          <!-- Botón: tabla con padding, no <a> con estilos inline. Outlook lo
               renderiza de forma mucho más consistente. -->
          <tr>
            <td align="center" style="padding:24px 28px 8px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background:#dc2626; border-radius:8px;">
                    <a href="{{link}}"
                       style="display:inline-block; padding:13px 28px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:8px;">
                      Verificar mi email
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Enlace en texto plano: si el botón no se ve o no funciona, la -->
          <!-- persona todavía tiene una salida. -->
          <tr>
            <td style="padding:8px 28px 0 28px;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#71717a;">
                Si el botón no funciona, copiá esta URL en tu navegador:
              </p>
              <p style="margin:6px 0 0 0; font-size:12px; line-height:1.5; color:#71717a; word-break:break-all;">
                {{link}}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 28px 32px 28px;">
              <p style="margin:0; padding-top:16px; border-top:1px solid #e4e4e7; font-size:11px; line-height:1.6; color:#a1a1aa;">
                Este enlace vence en 24 horas y funciona una sola vez.
                Si no te registraste, ignorá este mensaje.
              </p>
            </td>
          </tr>

        </table>

        <p style="margin:16px 0 0 0; font-size:11px; line-height:1.6; color:#a1a1aa; text-align:center;">
          Fenix Roller Hockey
        </p>

      </td>
    </tr>
  </table>

</body>
</html>
